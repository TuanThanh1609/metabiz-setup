name: Smax WhatsApp 15-Min Sync Cron

on:
  schedule:
    # Runs every 15 minutes 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Smax to Neon Sync on Vercel (Fitgum)
        run: |
          echo "=== 1. SYNC FITGUM MALAYSIA ==="
          curl -sS --max-time 45 -X GET "https://metabizai-smax.vercel.app/api/sync?project_id=fitgum&limit=50"
          echo ""
          echo "=== 2. BOTAPI TAGGER FITGUM ==="
          curl -sS --max-time 45 -X GET "https://metabizai-smax.vercel.app/api/botapi-tagger?project_id=fitgum"
          echo ""

      - name: Trigger Smax to Neon Sync on Vercel (Abera)
        run: |
          echo "=== 3. SYNC ABERA INDONESIA ==="
          curl -sS --max-time 45 -X GET "https://metabizai-smax.vercel.app/api/sync?project_id=abera&limit=50"
          echo ""
          echo "=== 4. BOTAPI TAGGER ABERA ==="
          curl -sS --max-time 45 -X GET "https://metabizai-smax.vercel.app/api/botapi-tagger?project_id=abera"
          echo ""

      - name: Trigger Smax to Neon Sync on Vercel (RedGold)
        run: |
          echo "=== 5. SYNC REDGOLD PHILIPPINES ==="
          curl -sS --max-time 45 -X GET "https://metabizai-smax.vercel.app/api/sync?project_id=redgold&limit=50"
          echo ""
          echo "=== 6. BOTAPI TAGGER REDGOLD ==="
          curl -sS --max-time 45 -X GET "https://metabizai-smax.vercel.app/api/botapi-tagger?project_id=redgold"
          echo ""
          echo "All projects synced successfully."
